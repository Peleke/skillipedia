# Sync skill entries from brunnr every 6 hours, and build on push to main.
# brunnr is public, so the checkout needs no cross-repo token.
# Fetches brunnr skills, syncs MDX entries, commits if changed, builds.
name: Build Skillipedia

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout brunnr skills
        uses: actions/checkout@v4
        with:
          repository: Peleke/brunnr
          path: _brunnr
          sparse-checkout: skills

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync skill entries from brunnr
        run: python scripts/sync-from-brunnr.py --brunnr-dir _brunnr --output-dir src/content/entries

      - name: Commit updated entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/entries/
          if git diff --cached --quiet; then
            echo "No entry changes to commit"
          else
            git commit -m "chore: sync skill entries from brunnr ($(git -C _brunnr rev-parse --short HEAD))"
            git push
          fi

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build
